<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Neon Energy Cloud</title>

<style>
html, body {
    margin: 0;
    height: 100%;
    background: black;
    overflow: hidden;
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}
</style>
</head>

<body>
<canvas id="c"></canvas>

<script>
const c = document.getElementById("c");
const ctx = c.getContext("2d");

function resize(){
    c.width = innerWidth;
    c.height = innerHeight;
}
addEventListener("resize", resize);
resize();

let t = 0;

// pseudo smooth noise
function noise(x, y, t){
    return Math.sin(x*1.3 + t) +
           Math.sin(y*1.7 - t*1.2) +
           Math.sin((x+y)*0.8 + t*0.7);
}

function draw(){
    const w = c.width;
    const h = c.height;
    const cx = w/2;
    const cy = h/2;

    // IMPORTANT: full reset (no persistence explosion)
    ctx.fillStyle = "black";
    ctx.fillRect(0,0,w,h);

    t += 0.01;

    const maxRadius = Math.min(w,h)*0.35;
    const pulse = (Math.sin(t*1.8)+1)/2;

    const step = 6; // lower = smoother, heavier GPU cost

    for(let y=0; y<h; y+=step){
        for(let x=0; x<w; x+=step){

            const dx = (x-cx);
            const dy = (y-cy);
            const dist = Math.sqrt(dx*dx + dy*dy);

            // breathing boundary (soft, NOT circular mask)
            const field = noise(x*0.01, y*0.01, t);

            const energy = (1 - dist/maxRadius) * 1.4 + field*0.25;

            if(energy <= 0) continue;

            // GLARE CORE (hot center spikes)
            const hot = Math.max(0, energy);

            const hue = (t*80 + field*40 + dist*0.1) % 360;

            const alpha = Math.min(1, hot);

            ctx.fillStyle = `hsla(${hue},100%,60%,${alpha})`;

            // NO circles → organic pixel energy field
            ctx.fillRect(x, y, step, step);
        }
    }

    // bloom pass (fake glare)
    ctx.globalCompositeOperation = "lighter";
    ctx.filter = "blur(18px)";
    ctx.drawImage(c, 0, 0);
    ctx.filter = "none";
    ctx.globalCompositeOperation = "source-over";

    requestAnimationFrame(draw);
}

draw();
</script>

</body>
</html>
